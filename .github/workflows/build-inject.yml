name: Build & Inject SoundCloud Ad Blocker
on: [workflow_dispatch]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build insert_dylib
        run: |
          git clone https://github.com/Tyilo/insert_dylib.git /tmp/insert_dylib
          cd /tmp/insert_dylib
          clang -o /tmp/insert_dylib_bin insert_dylib/main.c
          sudo cp /tmp/insert_dylib_bin /usr/local/bin/insert_dylib
      - name: Build tweak
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          xcrun clang -target arm64-apple-ios14.0 -isysroot "$SDK" -fobjc-arc -framework Foundation -framework AVFoundation -dynamiclib -o libSoundCloudAdBlocker.dylib soundcloud-adblocker-ios/Tweak.m
          mkdir -p soundcloud-adblocker-ios/.theos/obj/debug
          cp libSoundCloudAdBlocker.dylib soundcloud-adblocker-ios/.theos/obj/debug/
      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: soundcloud-dylib
          path: soundcloud-adblocker-ios/.theos/obj/debug/*.dylib
      - name: Download IPA
        run: |
          wget -O soundcloud.ipa "https://github.com/elunex73-ship-it/soundcloud-adblocker/releases/download/v1.0/com.soundcloud.TouchApp-8.85.0-eeveedecrypter.ipa"
          echo "IPA=soundcloud.ipa" >> $GITHUB_ENV
      - name: Inject into IPA
        run: |
          cp "$GITHUB_WORKSPACE"/soundcloud-adblocker-ios/.theos/obj/debug/*.dylib ./libSoundCloudAdBlocker.dylib 2>/dev/null || true
          chmod +x soundcloud-ipa-inject/inject.sh
          ./soundcloud-ipa-inject/inject.sh "$IPA" ./libSoundCloudAdBlocker.dylib "${{ secrets.SIGN_IDENTITY }}"
      - name: Upload patched IPA
        uses: actions/upload-artifact@v4
        with:
          name: soundcloud-patched
          path: "*-patched.ipa"