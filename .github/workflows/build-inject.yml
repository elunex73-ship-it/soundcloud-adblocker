name: Build & Inject SoundCloud Ad Blocker
on: [workflow_dispatch]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
      - name: Build tweak
        run: |
          cd soundcloud-adblocker-ios
          make package
      - name: Download IPA
        run: |
          gh release download v1.0 --pattern "*.ipa" --dir .
          IPA=$(ls *.ipa | head -n1)
          echo "IPA=$IPA" >> $GITHUB_ENV
      - name: Inject into IPA
        run: |
          cp "$GITHUB_WORKSPACE"/soundcloud-adblocker-ios/.theos/obj/debug/*.dylib ./libSoundCloudAdBlocker.dylib 2>/dev/null || true
          chmod +x soundcloud-ipa-inject/inject.sh
          ./soundcloud-ipa-inject/inject.sh "$IPA" ./libSoundCloudAdBlocker.dylib "${{ secrets.SIGN_IDENTITY }}"
      - name: Upload patched IPA
        uses: actions/upload-artifact@v4
        with:
          name: soundcloud-patched
          path: "*-patched.ipa"